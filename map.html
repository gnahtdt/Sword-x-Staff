      legendBar.innerHTML = "";
      if (!zone || !zone.markers) return;
      const groups = {}; // artPath -> { label, count }
      for (const m of zone.markers) {
        if (m.type !== "gather" && m.type !== "gem") continue;
        const art = ingredientIconFor(m) || iconSrc(m.icon || (FILTER_BY_TYPE[m.type] || {}).icon);
        if (!art || !LOCAL_ICONS.has(art.split("/").pop())) continue;
        const g = groups[art] || (groups[art] = {
          label: m.name || (FILTER_BY_TYPE[m.type] || {}).label || m.type,
          count: 0,
        });
        g.count++;
      }
      for (const art of Object.keys(groups)) {
        const g = groups[art];
        const chip = document.createElement("button");
        chip.className = "legend-chip" + (artIsActive(art) ? "" : " off");
        chip.title = g.label + " (" + g.count + ")";
        const img = document.createElement("img");
        img.src = art;
        img.alt = "";
        img.loading = "lazy";
        chip.appendChild(img);
        chip.addEventListener("click", () => {
          artState[art] = !artIsActive(art);
          localStorage.setItem("sxsArtToggles", JSON.stringify(artState));
          chip.classList.toggle("off", !artIsActive(art));
          renderMarkers();
        });
        legendBar.appendChild(chip);
      }
    }selectZone(initial.id);
  })();
})();</script>

</body>
</html>
